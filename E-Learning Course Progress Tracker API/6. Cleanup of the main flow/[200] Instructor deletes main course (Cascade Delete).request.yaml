$kind: http-request
description: Deletes course and cascade deletes all remaining lessons and progress docs.
url: "{{baseUrl}}/api/courses/{{courseId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{instructorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
