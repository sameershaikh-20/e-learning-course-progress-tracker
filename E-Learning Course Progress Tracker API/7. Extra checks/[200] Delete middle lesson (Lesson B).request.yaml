$kind: http-request
description: Deletes middle lesson (Lesson B, order 2).
url: "{{baseUrl}}/api/courses/{{extraCourseId}}/lessons/{{extraLessonBId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{instructorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
