$kind: http-request
description: "Instructor receives isEnrolled: false."
url: "{{baseUrl}}/api/courses/{{courseId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{instructorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      var json = pm.response.json();
      pm.test("isEnrolled is false for instructor", function () {
          pm.expect(json.data).to.have.property("isEnrolled", false);
      });
    language: text/javascript
order: 4000
