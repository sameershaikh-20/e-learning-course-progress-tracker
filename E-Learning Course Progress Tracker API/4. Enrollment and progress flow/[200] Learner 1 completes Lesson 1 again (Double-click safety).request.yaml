$kind: http-request
description: Verifies atomic upsert double-click safety.
url: "{{baseUrl}}/api/lessons/{{lesson1Id}}/complete"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{learnerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      var json = pm.response.json();
      pm.test("Repeated complete returns 200 without error", function () {
          pm.expect(json.data.progress).to.have.property("completed", true);
          pm.expect(json.data).to.have.property("courseCompleted", false);
      });
    language: text/javascript
order: 8000
