$kind: http-request
description: Non-enrolled learner receives 403 on progress.
url: "{{baseUrl}}/api/courses/{{courseId}}/progress"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{learner2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });

      pm.test("Data is null for unauthorized non-enrolled progress view", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("message").that.is.a("string");
          pm.expect(json.data).to.be.null;
      });
    language: text/javascript
order: 10000
