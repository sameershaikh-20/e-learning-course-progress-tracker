$kind: http-request
description: "Enrolled learner receives isEnrolled: true."
url: "{{baseUrl}}/api/courses/{{courseId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{learnerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      var json = pm.response.json();
      pm.test("isEnrolled is true for enrolled learner", function () {
          pm.expect(json.data).to.have.property("isEnrolled", true);
      });
    language: text/javascript
order: 3000
