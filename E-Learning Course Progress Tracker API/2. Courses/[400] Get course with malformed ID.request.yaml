$kind: http-request
description: Malformed MongoDB ObjectId parameter returns 400 Bad Request.
url: "{{baseUrl}}/api/courses/not-a-valid-id-123"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{learnerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Data is null on invalid ObjectId format", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("message").that.is.a("string");
          pm.expect(json.data).to.be.null;
      });
    language: text/javascript
order: 10000
