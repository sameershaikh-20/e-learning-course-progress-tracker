$kind: http-request
description: Creates isolated course for order tests.
url: "{{baseUrl}}/api/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Order Logic Course",
      "description": "Testing auto-incrementing orders"
    }
auth:
  type: bearer
  credentials:
    token: "{{instructorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      var json = pm.response.json();
      pm.test("Extra course created", function () {
          pm.expect(json.data).to.have.property("_id").that.is.a("string").and.not.empty;
          pm.environment.set("extraCourseId", json.data._id);
      });
    language: text/javascript
order: 1000
