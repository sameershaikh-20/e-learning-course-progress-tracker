$kind: http-request
description: Lesson C created with auto order 3.
url: "{{baseUrl}}/api/courses/{{extraCourseId}}/lessons"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Lesson C",
      "content": "Content C"
    }
auth:
  type: bearer
  credentials:
    token: "{{instructorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      var json = pm.response.json();
      pm.test("Lesson C assigned order 3", function () {
          pm.expect(json.data).to.have.property("order", 3);
      });
    language: text/javascript
order: 4000
