$kind: http-request
description: Completes final lesson; courseCompleted evaluates to true.
url: "{{baseUrl}}/api/lessons/{{lesson2Id}}/complete"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{learnerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      var json = pm.response.json();
      pm.test("Final lesson marked complete, course is completed", function () {
          pm.expect(json.data.progress).to.have.property("completed", true);
          pm.expect(json.data).to.have.property("courseCompleted", true);
      });
    language: text/javascript
order: 9000
