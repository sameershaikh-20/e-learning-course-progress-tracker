$kind: http-request
description: Learner cannot access instructor completion analytics (403).
url: "{{baseUrl}}/api/courses/{{courseId}}/completion-rate"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{learnerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });

      pm.test("Data is null for learner role on analytics", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("message").that.is.a("string");
          pm.expect(json.data).to.be.null;
      });
    language: text/javascript
order: 14000
