$kind: http-request
description: Non-enrolled learner receives 403 when trying to complete lesson.
url: "{{baseUrl}}/api/lessons/{{lesson1Id}}/complete"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{learner2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });

      pm.test("Data is null for unauthorized lesson completion", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("message").that.is.a("string");
          pm.expect(json.data).to.be.null;
      });
    language: text/javascript
order: 11000
