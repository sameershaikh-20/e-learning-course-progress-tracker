$kind: http-request
description: Verifies duplicate enrollment returns 400 Bad Request.
url: "{{baseUrl}}/api/courses/{{courseId}}/enroll"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{learnerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Data is null on duplicate enrollment", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("message").that.is.a("string");
          pm.expect(json.data).to.be.null;
      });
    language: text/javascript
order: 2000
