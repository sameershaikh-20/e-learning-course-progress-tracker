$kind: http-request
description: Initial progress metrics before completing any lessons.
url: "{{baseUrl}}/api/courses/{{courseId}}/progress"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{learnerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      var json = pm.response.json();
      pm.test("Initial progress is 0% with no completed lessons", function () {
          pm.expect(json.data).to.have.property("percentage", 0);
          pm.expect(json.data).to.have.property("isCourseCompleted", false);
          pm.expect(json.data).to.have.property("completedLessons", 0);
          pm.expect(json.data).to.have.property("totalLessons", 2);
      });
    language: text/javascript
order: 6000
