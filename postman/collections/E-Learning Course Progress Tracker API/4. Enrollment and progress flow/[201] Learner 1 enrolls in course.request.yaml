$kind: http-request
description: Enrolls Learner 1 in course.
url: "{{baseUrl}}/api/courses/{{courseId}}/enroll"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{learnerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      var json = pm.response.json();
      pm.test("Enrollment returns courseId and totalLessons", function () {
          pm.expect(json.data).to.have.property("courseId", pm.environment.get("courseId"));
          pm.expect(json.data).to.have.property("totalLessons", 2);
      });
    language: text/javascript
order: 1000
