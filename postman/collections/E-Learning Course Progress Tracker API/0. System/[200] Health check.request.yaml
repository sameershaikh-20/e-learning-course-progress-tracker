$kind: http-request
description: Checks server availability and uptime without authentication.
url: "{{baseUrl}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response follows { message, data } contract", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("message").that.is.a("string").and.not.empty;
          pm.expect(json).to.have.property("data").that.is.an("object");
          pm.expect(json.data).to.have.property("status", "OK");
      });
    language: text/javascript
order: 1000
