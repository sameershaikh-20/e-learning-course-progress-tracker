$kind: http-request
description: Non-string title rejected with 400.
url: "{{baseUrl}}/api/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": 9999,
      "description": "Invalid title type"
    }
auth:
  type: bearer
  credentials:
    token: "{{instructorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Data is null on invalid title type", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("message").that.is.a("string");
      });
    language: text/javascript
order: 8000
