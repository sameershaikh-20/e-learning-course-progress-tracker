$kind: http-request
description: Deletes lesson 1, triggering cascade progress deletion.
url: "{{baseUrl}}/api/courses/{{courseId}}/lessons/{{lesson1Id}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{instructorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
