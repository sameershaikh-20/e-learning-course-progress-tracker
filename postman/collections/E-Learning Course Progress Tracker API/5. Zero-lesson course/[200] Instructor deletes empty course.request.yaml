$kind: http-request
description: Deletes empty course cleanly.
url: "{{baseUrl}}/api/courses/{{emptyCourseId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{instructorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
