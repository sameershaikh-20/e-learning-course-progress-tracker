$kind: http-request
description: Empty course progress evaluates to 0% and not completed.
url: "{{baseUrl}}/api/courses/{{emptyCourseId}}/progress"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{learnerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      var json = pm.response.json();
      pm.test("Progress is 0% and isCourseCompleted is false", function () {
          pm.expect(json.data).to.have.property("percentage", 0);
          pm.expect(json.data).to.have.property("isCourseCompleted", false);
          pm.expect(json.data).to.have.property("totalLessons", 0);
          pm.expect(json.data).to.have.property("completedLessons", 0);
      });
    language: text/javascript
order: 3000
