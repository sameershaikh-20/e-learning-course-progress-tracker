$kind: http-request
description: Verifies that incorrect credentials return 401 Unauthorized.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{learnerEmail}}",
      "password": "WrongPassword123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Data is null on authentication failure", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("message").that.is.a("string");
          pm.expect(json.data).to.be.null;
      });
    language: text/javascript
order: 9000
